<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will You Be My Valentine?</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a0011 0%, #2d0a1e 30%, #0d0015 100%);
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      color: #fff;
    }

    /* ---- Floating hearts background ---- */
    .hearts-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .hearts-bg .heart {
      position: absolute;
      bottom: -60px;
      font-size: 20px;
      animation: floatUp linear infinite;
      opacity: 0.15;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg) scale(1);   opacity: 0; }
      10%  { opacity: 0.15; }
      90%  { opacity: 0.15; }
      100% { transform: translateY(-110vh) rotate(720deg) scale(0.5); opacity: 0; }
    }

    /* ---- Main card ---- */
    .card {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 3rem 2.5rem;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 100, 130, 0.15);
      box-shadow: 0 0 80px rgba(255, 50, 100, 0.08);
      max-width: 520px;
      width: 90%;
      animation: cardEntry 1.2s cubic-bezier(.22,1,.36,1) forwards;
      opacity: 0;
      transform: translateY(40px) scale(0.95);
    }
    @keyframes cardEntry {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ---- Beating heart ---- */
    .big-heart {
      font-size: 5rem;
      display: inline-block;
      animation: beat 1s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(255, 60, 100, 0.6));
      margin-bottom: 0.5rem;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      15%      { transform: scale(1.15); }
      30%      { transform: scale(1); }
      45%      { transform: scale(1.1); }
    }

    .card h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ff6b8a, #ff3e6c, #ff8fa3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.3;
    }

    .card p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 2rem;
      font-weight: 300;
    }

    /* ---- Buttons ---- */
    .buttons {
      display: flex;
      gap: 1.2rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-yes {
      padding: 14px 48px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: linear-gradient(135deg, #ff3e6c, #ff6b8a);
      color: #fff;
      box-shadow: 0 4px 30px rgba(255, 62, 108, 0.4);
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
    }
    .btn-yes:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 40px rgba(255, 62, 108, 0.6);
    }

    .btn-no {
      padding: 14px 48px;
      font-size: 1.1rem;
      font-weight: 600;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      cursor: pointer;
      background: transparent;
      color: rgba(255, 255, 255, 0.6);
      transition: all 0.25s ease;
      font-family: 'Poppins', sans-serif;
      position: relative;
    }
    .btn-no:hover {
      /* The no button runs away! */
    }

    /* ---- Celebration overlay ---- */
    .celebration {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, rgba(255, 30, 80, 0.15) 0%, rgba(10, 0, 15, 0.97) 70%);
    }
    .celebration.active {
      display: flex;
      animation: fadeIn 0.6s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .celebration h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 3.5rem;
      background: linear-gradient(135deg, #ff6b8a, #ffb6c1, #ff3e6c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: celebPulse 2s ease-in-out infinite;
      text-align: center;
      padding: 0 1rem;
    }
    @keyframes celebPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.05); }
    }

    .celebration p {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 1rem;
      font-weight: 300;
    }

    .celebration .big-heart {
      font-size: 6rem;
      margin-bottom: 1rem;
    }

    /* ---- Confetti canvas ---- */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      z-index: 99;
      pointer-events: none;
    }

    /* ---- Responsive ---- */
    @media (max-width: 480px) {
      .card h1 { font-size: 2rem; }
      .card p   { font-size: 0.95rem; }
      .big-heart { font-size: 3.5rem; }
      .btn-yes, .btn-no { padding: 12px 32px; font-size: 1rem; }
      .celebration h1 { font-size: 2.5rem; }
    }
  </style>
</head>
<body>

  <!-- Floating hearts background -->
  <div class="hearts-bg" id="hearts-bg"></div>

  <!-- Main card -->
  <div class="card" id="card">
    <div class="big-heart">&#10084;&#65039;</div>
    <h1>Will You Be My Valentine?</h1>
    <p>
      Every moment with you feels like a dream I never want to wake up from.
      You make my world brighter, warmer, and infinitely more beautiful.
      So I have just one question...
    </p>
    <div class="buttons">
      <button class="btn-yes" id="btn-yes">Yes!</button>
      <button class="btn-no"  id="btn-no">No</button>
    </div>
  </div>

  <!-- Celebration screen -->
  <div class="celebration" id="celebration">
    <div class="big-heart">&#10084;&#65039;</div>
    <h1>You just made me the happiest person alive!</h1>
    <p>Happy Valentine's Day, my love.</p>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <script>
    // ---- Floating background hearts ----
    (function createBgHearts() {
      const container = document.getElementById('hearts-bg');
      const symbols = ['\u2764\uFE0F', '\uD83D\uDC95', '\uD83D\uDC96', '\uD83E\uDE77', '\u2665\uFE0F'];
      for (let i = 0; i < 30; i++) {
        const span = document.createElement('span');
        span.classList.add('heart');
        span.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        span.style.left = Math.random() * 100 + '%';
        span.style.fontSize = (14 + Math.random() * 22) + 'px';
        span.style.animationDuration = (8 + Math.random() * 14) + 's';
        span.style.animationDelay = (Math.random() * 12) + 's';
        container.appendChild(span);
      }
    })();

    // ---- "No" button runs away ----
    const btnNo = document.getElementById('btn-no');
    let noCount = 0;
    const phrases = [
      "No", "Are you sure?", "Really sure?", "Think again!", 
      "Last chance!", "Surely not!", "You might regret this!",
      "Give it another thought!", "Pretty please?", "Fine... just kidding!"
    ];

    btnNo.addEventListener('mouseenter', () => {
      noCount++;
      if (noCount > phrases.length - 1) noCount = phrases.length - 1;
      btnNo.textContent = phrases[noCount];

      // Move to random position within viewport
      const maxX = window.innerWidth - btnNo.offsetWidth - 20;
      const maxY = window.innerHeight - btnNo.offsetHeight - 20;
      const newX = Math.random() * maxX;
      const newY = Math.random() * maxY;

      btnNo.style.position = 'fixed';
      btnNo.style.left = newX + 'px';
      btnNo.style.top = newY + 'px';
      btnNo.style.zIndex = '50';

      // Make the Yes button grow slightly each time
      const btnYes = document.getElementById('btn-yes');
      const currentScale = 1 + noCount * 0.05;
      btnYes.style.transform = `scale(${Math.min(currentScale, 1.5)})`;
    });

    // Mobile: also handle touch
    btnNo.addEventListener('touchstart', (e) => {
      e.preventDefault();
      btnNo.dispatchEvent(new Event('mouseenter'));
    });

    // ---- "Yes" button celebration ----
    document.getElementById('btn-yes').addEventListener('click', () => {
      document.getElementById('card').style.display = 'none';
      btnNo.style.display = 'none';
      document.getElementById('celebration').classList.add('active');
      launchConfetti();
    });

    // ---- Confetti ----
    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const pieces = [];
      const colors = ['#ff3e6c', '#ff6b8a', '#ffb6c1', '#ff85a2', '#fff', '#ffd1dc', '#ff1744', '#f50057'];
      const hearts = ['\u2764', '\u2665', '\uD83D\uDC95'];

      for (let i = 0; i < 200; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          r: Math.random() * 6 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 4,
          vy: Math.random() * 3 + 2,
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 8,
          isHeart: Math.random() > 0.7,
          heart: hearts[Math.floor(Math.random() * hearts.length)],
          opacity: 1
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;

        for (const p of pieces) {
          p.x += p.vx;
          p.y += p.vy;
          p.rotation += p.rotationSpeed;
          p.vy += 0.02; // gravity

          if (p.y > canvas.height + 20) {
            p.opacity -= 0.01;
          }

          if (p.opacity <= 0) continue;
          alive = true;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.globalAlpha = Math.max(p.opacity, 0);

          if (p.isHeart) {
            ctx.font = `${p.r * 3}px serif`;
            ctx.fillText(p.heart, 0, 0);
          } else {
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.5);
          }

          ctx.restore();
        }

        if (alive) requestAnimationFrame(draw);
      }

      draw();

      // Resize handler
      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });
    }
  </script>
</body>
</html>
