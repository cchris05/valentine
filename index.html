<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nawel, Will You Be My Valentine?</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;400;500;600;700&family=Caveat:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #ffe0ec 0%, #ffc2d9 25%, #ffb3d0 50%, #ffd6e7 75%, #fff0f5 100%);
      font-family: 'Quicksand', sans-serif;
      overflow: hidden;
      color: #5a2040;
    }

    /* ---- Envelope intro ---- */
    .envelope-intro {
      position: fixed; inset: 0; z-index: 500;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(160deg, #ffe0ec 0%, #ffc2d9 25%, #ffb3d0 50%, #ffd6e7 75%, #fff0f5 100%);
      cursor: pointer;
      transition: opacity 1.2s cubic-bezier(.4,0,.2,1);
    }
    .envelope-intro.hidden {
      opacity: 0; pointer-events: none;
    }
    .envelope-intro .tap-hint {
      margin-top: 2.5rem;
      font-family: 'Caveat', cursive;
      font-size: 1.2rem; color: #b06080;
      animation: hintPulse 2.5s ease-in-out infinite;
      font-weight: 500; letter-spacing: 0.5px;
    }
    @keyframes hintPulse {
      0%, 100% { opacity: 0.4; transform: translateY(0); }
      50%      { opacity: 0.9; transform: translateY(-4px); }
    }

    /* Envelope container */
    .envelope {
      width: 360px; height: 250px;
      position: relative;
      filter: drop-shadow(0 12px 35px rgba(140, 60, 80, 0.18));
      transition: transform 0.6s cubic-bezier(.4,0,.2,1);
    }
    .envelope:hover:not(.opened) {
      transform: scale(1.02) translateY(-3px);
    }

    /* Envelope body -- vintage kraft paper */
    .envelope-body {
      position: absolute; inset: 0;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(180,130,100,0.04) 28px, rgba(180,130,100,0.04) 29px),
        linear-gradient(160deg, #f5e6d3 0%, #eedcca 30%, #e8d0bb 60%, #f0dece 100%);
      border-radius: 6px;
      border: 1px solid rgba(180, 140, 110, 0.25);
      z-index: 3;
      pointer-events: none;
    }

    /* Inner V-fold */
    .envelope-body::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 100%;
      background: linear-gradient(160deg, #ecdac5, #e3ccb5);
      clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
      z-index: 1;
    }

    /* Wax seal */
    .envelope-seal {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 64px; height: 64px; z-index: 15;
      display: flex; align-items: center; justify-content: center;
      filter: drop-shadow(0 4px 10px rgba(100, 20, 40, 0.4));
      transition: opacity 0.5s ease 0.2s, transform 0.5s ease 0.2s;
    }
    .envelope-seal .wax {
      width: 100%; height: 100%;
      background: radial-gradient(circle at 38% 32%, #e04868, #c03050 40%, #8a2040 75%, #6a1530 100%);
      border-radius: 50%; position: absolute;
      box-shadow:
        inset 0 3px 6px rgba(255,180,200,0.25),
        inset 0 -3px 8px rgba(60,5,20,0.35),
        inset 2px 0 4px rgba(255,150,170,0.1),
        0 2px 4px rgba(80,10,30,0.2);
    }
    /* Wax seal bumpy edge effect */
    .envelope-seal .wax::before {
      content: '';
      position: absolute; inset: -3px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 32%, #c84060, #a02840 50%, #7a1830 100%);
      z-index: -1;
      clip-path: polygon(
        50% 0%, 63% 2%, 75% 5%, 85% 12%, 93% 22%, 98% 35%,
        100% 50%, 98% 63%, 93% 75%, 85% 85%, 75% 93%, 63% 98%,
        50% 100%, 38% 97%, 25% 93%, 15% 85%, 8% 75%, 3% 63%,
        0% 50%, 2% 38%, 5% 25%, 12% 15%, 22% 8%, 35% 3%
      );
    }
    .envelope-seal .seal-letter {
      position: relative; z-index: 1;
      font-family: 'Dancing Script', cursive;
      font-size: 2rem;
      font-weight: 700;
      color: rgba(255, 220, 230, 0.9);
      text-shadow: 0 1px 2px rgba(60, 10, 20, 0.4), 0 -1px 1px rgba(255, 200, 210, 0.15);
      animation: sealBeat 2.5s ease-in-out infinite;
      line-height: 1;
    }
    @keyframes sealBeat {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }
    .envelope.opened .envelope-seal {
      opacity: 0; transform: translate(-50%, -50%) scale(0.8);
    }

    /* Top flap */
    .envelope-flap {
      position: absolute; top: 0; left: 0; right: 0;
      height: 138px;
      background: linear-gradient(180deg, #f0dcc8, #e8d0bb, #ecdac5);
      clip-path: polygon(0 0, 50% 100%, 100% 0);
      transform-origin: top center;
      z-index: 10;
      transition: transform 1.4s cubic-bezier(.4,0,.2,1);
    }
    .envelope.opened .envelope-flap {
      transform: rotateX(180deg);
    }

    /* Letter -- hidden behind body, JS lifts it out */
    .envelope-letter {
      position: absolute;
      bottom: 12px; left: 20px; right: 20px;
      height: 185px;
      background:
        linear-gradient(to bottom, transparent 27px, rgba(180,140,120,0.08) 27px, rgba(180,140,120,0.08) 28px),
        linear-gradient(170deg, #fdf8f0, #faf3e8, #f5ece0);
      background-size: 100% 28px, 100% 100%;
      border-radius: 3px;
      box-shadow: 0 2px 10px rgba(120, 80, 50, 0.1);
      z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border: 1px solid rgba(180, 140, 110, 0.15);
      transition: none;
    }
    .envelope-letter-text {
      font-family: 'Caveat', cursive; font-size: 1.2rem;
      color: #7a4a30; text-align: center;
      padding: 1rem 1.2rem; opacity: 0; line-height: 1.6;
    }
    .envelope-letter-sub {
      font-family: 'Dancing Script', cursive; font-size: 0.9rem;
      color: #b07060; opacity: 0; margin-top: 0.3rem;
    }

    /* ---- Soft pink glow orbs ---- */
    .glow-orb {
      position: fixed; border-radius: 50%; filter: blur(100px); pointer-events: none; z-index: 0;
    }
    .glow-orb.one   { width: 500px; height: 500px; background: rgba(255,150,180,0.3); top: -150px; left: -150px; animation: orbFloat 14s ease-in-out infinite; }
    .glow-orb.two   { width: 400px; height: 400px; background: rgba(255,180,200,0.25); bottom: -120px; right: -120px; animation: orbFloat 18s ease-in-out infinite reverse; }
    .glow-orb.three { width: 300px; height: 300px; background: rgba(255,200,220,0.3); top: 40%; left: 60%; animation: orbFloat 12s ease-in-out infinite 2s; }
    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0); }
      33%      { transform: translate(40px, -50px); }
      66%      { transform: translate(-30px, 40px); }
    }

    /* ---- Floating hearts ---- */
    .hearts-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .hearts-bg .heart { position: absolute; bottom: -60px; opacity: 0; }
    .hearts-bg .heart.rise { animation: floatUp linear infinite; }
    .hearts-bg .heart.drift { animation: floatDrift linear infinite; }
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 0; }
      8%   { opacity: 0.5; }
      50%  { opacity: 0.6; }
      90%  { opacity: 0.35; }
      100% { transform: translateY(-115vh) rotate(360deg) scale(0.5); opacity: 0; }
    }
    @keyframes floatDrift {
      0%   { transform: translateY(0) translateX(0) rotate(0deg) scale(0.8); opacity: 0; }
      8%   { opacity: 0.35; }
      25%  { transform: translateY(-28vh) translateX(30px) rotate(90deg) scale(0.9); }
      50%  { transform: translateY(-55vh) translateX(-20px) rotate(180deg) scale(1); opacity: 0.45; }
      75%  { transform: translateY(-83vh) translateX(25px) rotate(270deg) scale(0.85); }
      100% { transform: translateY(-115vh) translateX(-10px) rotate(360deg) scale(0.6); opacity: 0; }
    }

    /* ---- Sparkle dots ---- */
    .sparkles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .sparkles .dot {
      position: absolute; border-radius: 50%;
      background: rgba(255, 180, 200, 0.6);
      animation: twinkle ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50%      { opacity: 0.8; transform: scale(1.2); }
    }

    /* ---- Music toggle ---- */
    .music-toggle {
      position: fixed; top: 20px; right: 20px; z-index: 200;
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid rgba(212, 69, 106, 0.2);
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(10px);
      cursor: pointer; font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s ease;
    }
    .music-toggle:hover { background: rgba(255, 255, 255, 0.75); transform: scale(1.08); }

    /* ---- Main card -- vintage letter paper ---- */
    .card {
      position: relative; z-index: 10; text-align: center;
      padding: 2.8rem 2.5rem 2.2rem;
      border-radius: 4px;
      background:
        /* Ruled lines */
        repeating-linear-gradient(
          to bottom,
          transparent, transparent 31px,
          rgba(170, 140, 120, 0.1) 31px, rgba(170, 140, 120, 0.1) 32px
        ),
        /* Left margin line */
        linear-gradient(
          to right,
          transparent 32px, rgba(180, 100, 100, 0.1) 32px,
          rgba(180, 100, 100, 0.1) 33px, transparent 33px
        ),
        /* Parchment paper */
        linear-gradient(170deg, #fdf8f0 0%, #faf3e8 30%, #f7efe3 60%, #fdf8f0 100%);
      max-width: 460px; width: 90%;
      animation: cardEntry 1.4s cubic-bezier(.22,1,.36,1) forwards;
      opacity: 0; transform: translateY(30px) scale(0.96);
      box-shadow:
        0 1px 3px rgba(120, 80, 50, 0.06),
        0 6px 20px rgba(120, 80, 50, 0.08),
        0 14px 45px rgba(120, 80, 50, 0.06),
        inset 0 0 50px rgba(200, 170, 140, 0.05);
      border: 1px solid rgba(190, 160, 130, 0.2);
    }
    /* Paper texture */
    .card::before {
      content: '';
      position: absolute; inset: 0; border-radius: 4px;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }
    /* Paper curl shadow */
    .card::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 20px; right: 20px; height: 8px;
      background: radial-gradient(ellipse at center, rgba(120, 80, 50, 0.08) 0%, transparent 70%);
      z-index: -1;
    }
    @keyframes cardEntry { to { opacity: 1; transform: translateY(0) scale(1); } }

    .cute-bear {
      font-size: 4.5rem; margin-bottom: 0.2rem;
      animation: bearBounce 2s ease-in-out infinite; display: inline-block;
      position: relative; z-index: 1;
    }
    @keyframes bearBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25%      { transform: translateY(-10px) rotate(-4deg); }
      75%      { transform: translateY(-5px) rotate(4deg); }
    }

    .hearts-row-top {
      font-size: 1.5rem; letter-spacing: 6px; margin-bottom: 0.5rem;
      animation: heartsGlow 2s ease-in-out infinite;
      position: relative; z-index: 1;
    }
    @keyframes heartsGlow {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50%      { opacity: 1; transform: scale(1.05); }
    }

    .card h1 {
      font-family: 'Dancing Script', cursive; font-size: 2.6rem;
      margin-bottom: 0.6rem; color: #8a3050; line-height: 1.3;
      position: relative; z-index: 1;
    }

    .typewriter-text {
      font-family: 'Caveat', cursive;
      font-size: 1.35rem; line-height: 1.9; color: #4a2835;
      margin-bottom: 1.8rem; font-weight: 500; min-height: 5em;
      letter-spacing: 0.3px;
      position: relative; z-index: 1;
    }
    .typewriter-text .highlight {
      color: #a03050; font-weight: 700;
    }
    .quill-cursor {
      display: inline-block;
      font-size: 1.1rem;
      margin-left: 1px;
      vertical-align: text-bottom;
      position: relative;
      top: -2px;
      filter: drop-shadow(0 1px 2px rgba(150, 50, 80, 0.15));
      transition: transform 0.15s cubic-bezier(.4,0,.2,1);
      transform: rotate(-12deg) translateY(0);
      transform-origin: bottom right;
    }
    .quill-cursor.writing {
      animation: quillFlow 1.8s cubic-bezier(.4,0,.2,1) infinite;
    }
    .quill-cursor.paused {
      animation: quillRest 2s ease-in-out infinite;
    }
    @keyframes quillFlow {
      0%   { transform: rotate(-12deg) translateY(0) translateX(0); }
      15%  { transform: rotate(-8deg) translateY(-1px) translateX(0.5px); }
      30%  { transform: rotate(-14deg) translateY(0.5px) translateX(-0.3px); }
      50%  { transform: rotate(-9deg) translateY(-1.5px) translateX(0.3px); }
      65%  { transform: rotate(-13deg) translateY(0) translateX(-0.5px); }
      80%  { transform: rotate(-10deg) translateY(-0.5px) translateX(0.2px); }
      100% { transform: rotate(-12deg) translateY(0) translateX(0); }
    }
    @keyframes quillRest {
      0%, 100% { transform: rotate(-12deg) translateY(0); }
      50%      { transform: rotate(-14deg) translateY(-1px); }
    }
    .quill-cursor.done {
      animation: quillLift 1.2s cubic-bezier(.4,0,.2,1) forwards;
    }
    @keyframes quillLift {
      0%   { opacity: 1; transform: rotate(-12deg) translateY(0); }
      40%  { opacity: 0.9; transform: rotate(-20deg) translateY(-8px) translateX(4px); }
      100% { opacity: 0; transform: rotate(-40deg) translateY(-25px) translateX(18px); }
    }

    /* ---- Buttons ---- */
    .buttons {
      display: flex; gap: 1rem; justify-content: center;
      align-items: center; flex-wrap: wrap;
      opacity: 0; transition: opacity 0.8s ease;
    }
    .buttons.visible { opacity: 1; }

    .btn-yes {
      padding: 14px 44px; font-size: 1.1rem; font-weight: 700;
      border: none; border-radius: 50px; cursor: pointer;
      background: linear-gradient(135deg, #ff6b8a, #ff8fa3, #ff6b8a);
      background-size: 200% 200%; color: #fff;
      box-shadow: 0 4px 20px rgba(255, 107, 138, 0.35);
      transition: all 0.6s cubic-bezier(.34,1.56,.64,1);
      font-family: 'Quicksand', sans-serif; letter-spacing: 0.5px;
      animation: yesGentlePulse 2.5s ease-in-out infinite;
    }
    @keyframes yesGentlePulse {
      0%, 100% { box-shadow: 0 4px 20px rgba(255, 107, 138, 0.3); }
      50%      { box-shadow: 0 4px 28px rgba(255, 107, 138, 0.5); }
    }
    .btn-yes:hover { box-shadow: 0 6px 30px rgba(255, 107, 138, 0.5); background-position: 100% 50%; }

    .btn-no {
      padding: 14px 44px; font-size: 1.1rem; font-weight: 600;
      border: 2px solid rgba(212, 69, 106, 0.25); border-radius: 50px;
      cursor: pointer; background: rgba(255, 255, 255, 0.5); color: #b05070;
      transition: all 0.7s cubic-bezier(.25,.8,.25,1); font-family: 'Quicksand', sans-serif;
    }
    .btn-no:hover { background: rgba(255, 255, 255, 0.7); }

    .sad-message {
      margin-top: 1.2rem; font-size: 0.9rem; color: #c06080;
      min-height: 1.4em; transition: all 0.5s cubic-bezier(.25,.8,.25,1);
      font-style: italic; opacity: 0;
    }
    .sad-message.visible { opacity: 1; }

    @keyframes cardWobble {
      0%   { transform: rotate(0deg) scale(1); }
      20%  { transform: rotate(-1deg) scale(1.01); }
      40%  { transform: rotate(0.8deg) scale(1); }
      60%  { transform: rotate(-0.5deg) scale(1.005); }
      80%  { transform: rotate(0.3deg) scale(1); }
      100% { transform: rotate(0deg) scale(1); }
    }

    /* ---- Celebration ---- */
    .celebration {
      position: fixed; inset: 0; z-index: 100;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, rgba(255,220,235,0.95) 0%, rgba(255,200,220,0.98) 50%, rgba(255,180,210,0.95) 100%);
    }
    .celebration.active { display: flex; animation: fadeIn 0.8s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .celebration .celeb-emoji {
      font-size: 5rem; animation: celebBounce 1.5s ease-in-out infinite; margin-bottom: 0.8rem;
    }
    @keyframes celebBounce {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25%      { transform: scale(1.1) rotate(-5deg); }
      50%      { transform: scale(1.15) rotate(0deg); }
      75%      { transform: scale(1.1) rotate(5deg); }
    }

    .celebration h1 {
      font-family: 'Dancing Script', cursive; font-size: 3rem; color: #d4456a;
      animation: celebPulse 3s ease-in-out infinite; text-align: center;
      padding: 0 1.5rem; line-height: 1.4;
      text-shadow: 0 2px 15px rgba(212, 69, 106, 0.15);
    }
    @keyframes celebPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

    .celebration p { font-size: 1.15rem; color: #a05070; margin-top: 0.6rem; font-weight: 500; }

    .celebration .hearts-row {
      margin-top: 1.5rem; font-size: 2rem; letter-spacing: 10px;
      animation: heartsWave 2s ease-in-out infinite;
    }
    @keyframes heartsWave {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50%      { transform: scale(1.1); opacity: 1; }
    }

    #confetti-canvas { position: fixed; inset: 0; z-index: 99; pointer-events: none; }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.5rem; }
      .card h1 { font-size: 2rem; }
      .typewriter-text { font-size: 0.9rem; }
      .cute-bear { font-size: 3.5rem; }
      .btn-yes, .btn-no { padding: 12px 30px; font-size: 1rem; }
      .celebration h1 { font-size: 2.2rem; }
      .celebration .celeb-emoji { font-size: 4rem; }
    }
  </style>
</head>
<body>

  <!-- Envelope intro -->
  <div class="envelope-intro" id="envelope-intro">
    <div class="envelope" id="envelope">
      <div class="envelope-flap"></div>
      <div class="envelope-seal">
        <div class="wax"></div>
        <span class="seal-letter">C</span>
      </div>
      <div class="envelope-body"></div>
      <div class="envelope-letter" id="envelope-letter">
        <div class="envelope-letter-text" id="letter-text">For you, Nawel</div>
        <div class="envelope-letter-sub" id="letter-sub">&#x2763;&#xFE0F; with love</div>
      </div>
    </div>
    <div class="tap-hint">tap to open</div>
  </div>

  <button class="music-toggle" id="music-toggle" title="Toggle music">&#x1F507;</button>

  <div class="glow-orb one"></div>
  <div class="glow-orb two"></div>
  <div class="glow-orb three"></div>
  <div class="hearts-bg" id="hearts-bg"></div>
  <div class="sparkles" id="sparkles"></div>

  <div class="card" id="card" style="display:none;">
    <div class="cute-bear" id="cute-bear">&#x1F9F8;</div>
    <div class="hearts-row-top">&#x1F495; &#x1F496; &#x1F495;</div>
    <h1>Nawel, Will You Be My Valentine?</h1>
    <div class="typewriter-text" id="typewriter-text"></div>
    <div class="buttons" id="buttons">
      <button class="btn-yes" id="btn-yes">Yes!</button>
      <button class="btn-no"  id="btn-no">No</button>
    </div>
    <div class="sad-message" id="sad-message"></div>
  </div>

  <div class="celebration" id="celebration">
    <div class="celeb-emoji">&#x1F970;</div>
    <h1>Yaaay! Nawel, you just made me the happiest person alive!</h1>
    <p>Happy Valentine's Day, Nawel.</p>
    <div class="hearts-row">&#x1F495; &#x1F496; &#x1F497; &#x1F49E; &#x1F495;</div>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <script>
    // ==============================
    // MUSIC (music-box melody)
    // ==============================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx, musicPlaying = false;

    function createMelody() {
      audioCtx = new AudioCtx();
      const notes = [
        { f: 523.25, t: 0,    d: 0.5 },
        { f: 587.33, t: 0.5,  d: 0.5 },
        { f: 659.25, t: 1.0,  d: 0.75 },
        { f: 587.33, t: 1.75, d: 0.5 },
        { f: 523.25, t: 2.25, d: 0.75 },
        { f: 493.88, t: 3.0,  d: 0.5 },
        { f: 440.00, t: 3.5,  d: 0.75 },
        { f: 493.88, t: 4.25, d: 0.5 },
        { f: 523.25, t: 4.75, d: 0.75 },
        { f: 440.00, t: 5.5,  d: 0.5 },
        { f: 392.00, t: 6.0,  d: 0.75 },
        { f: 440.00, t: 6.75, d: 0.5 },
        { f: 523.25, t: 7.25, d: 1.0 },
        { f: 493.88, t: 8.25, d: 0.5 },
        { f: 440.00, t: 8.75, d: 0.5 },
        { f: 392.00, t: 9.25, d: 0.75 },
        { f: 349.23, t: 10.0, d: 0.5 },
        { f: 392.00, t: 10.5, d: 0.5 },
        { f: 440.00, t: 11.0, d: 0.75 },
        { f: 523.25, t: 11.75,d: 1.25 },
      ];
      const loopLen = 13;
      function playLoop() {
        if (!musicPlaying) return;
        const now = audioCtx.currentTime;
        notes.forEach(n => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = n.f;
          gain.gain.setValueAtTime(0, now + n.t);
          gain.gain.linearRampToValueAtTime(0.08, now + n.t + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(now + n.t);
          osc.stop(now + n.t + n.d + 0.1);

          const osc2 = audioCtx.createOscillator();
          const gain2 = audioCtx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.value = n.f * 2;
          gain2.gain.setValueAtTime(0, now + n.t);
          gain2.gain.linearRampToValueAtTime(0.02, now + n.t + 0.05);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d * 0.6);
          osc2.connect(gain2).connect(audioCtx.destination);
          osc2.start(now + n.t);
          osc2.stop(now + n.t + n.d + 0.1);
        });
        setTimeout(() => playLoop(), loopLen * 1000);
      }
      playLoop();
    }

    document.getElementById('music-toggle').addEventListener('click', function() {
      if (!musicPlaying) {
        musicPlaying = true;
        this.textContent = '\uD83D\uDD0A';
        if (!audioCtx) createMelody(); else audioCtx.resume();
      } else {
        musicPlaying = false;
        this.textContent = '\uD83D\uDD07';
        if (audioCtx) audioCtx.suspend();
      }
    });

    // ==============================
    // TYPEWRITER (smooth, natural pace)
    // ==============================
    const segments = [
      { text: "Hey Nawel" },
      { text: ", every moment with you feels like a dream I never want to wake up from. " },
      { text: "You make my world " },
      { text: "brighter", highlight: true },
      { text: ", " },
      { text: "warmer", highlight: true },
      { text: ", and infinitely more " },
      { text: "beautiful", highlight: true },
      { text: ". So... what do you say?" },
    ];

    const twEl = document.getElementById('typewriter-text');
    const buttonsEl = document.getElementById('buttons');
    let segIdx = 0, charIdx = 0, currentSpan = null;

    // Add quill cursor
    const cursor = document.createElement('span');
    cursor.classList.add('quill-cursor', 'writing');
    cursor.textContent = '\uD83E\uDEB6';
    twEl.appendChild(cursor);

    function setQuillState(state) {
      cursor.classList.remove('writing', 'paused', 'done');
      if (state) cursor.classList.add(state);
    }

    function typeNext() {
      if (segIdx >= segments.length) {
        // Done -- quill lifts off the page, then show buttons
        setQuillState('done');
        setTimeout(() => cursor.remove(), 1000);
        buttonsEl.classList.add('visible');
        return;
      }

      const seg = segments[segIdx];

      // Create highlight span at start of a highlighted segment
      if (charIdx === 0 && seg.highlight) {
        currentSpan = document.createElement('span');
        currentSpan.classList.add('highlight');
        twEl.insertBefore(currentSpan, cursor);
      }

      if (charIdx < seg.text.length) {
        const ch = seg.text[charIdx];

        if (seg.highlight && currentSpan) {
          currentSpan.textContent += ch;
        } else {
          twEl.insertBefore(document.createTextNode(ch), cursor);
        }

        charIdx++;

        // Natural typing rhythm -- a bit faster
        let delay = 35 + Math.random() * 20;
        if (ch === '.' || ch === '?') {
          delay = 250 + Math.random() * 120;
          setQuillState('paused');
          setTimeout(() => setQuillState('writing'), delay - 60);
        } else if (ch === ',') {
          delay = 130 + Math.random() * 60;
          setQuillState('paused');
          setTimeout(() => setQuillState('writing'), delay - 40);
        } else if (ch === ' ') {
          delay = 25 + Math.random() * 15;
        }

        setTimeout(typeNext, delay);
      } else {
        // Move to next segment
        segIdx++;
        charIdx = 0;
        currentSpan = null;
        setTimeout(typeNext, 30);
      }
    }

    // ==============================
    // ENVELOPE INTRO
    // ==============================
    const envelopeIntro = document.getElementById('envelope-intro');
    const envelope = document.getElementById('envelope');
    const card = document.getElementById('card');
    let envelopeOpened = false;

    const envLetter = document.getElementById('envelope-letter');
    const letterText = document.getElementById('letter-text');
    const letterSub = document.getElementById('letter-sub');

    envelopeIntro.addEventListener('click', () => {
      if (envelopeOpened) return;
      envelopeOpened = true;

      // Step 1: Open the flap (1.4s)
      envelope.classList.add('opened');

      // Step 2: After flap opens, bring letter to front and slide up
      setTimeout(() => {
        // Raise letter above the envelope body
        envLetter.style.zIndex = '20';
        // Animate letter rising smoothly
        envLetter.style.transition = 'transform 1.6s cubic-bezier(.25,.8,.25,1)';
        envLetter.style.transform = 'translateY(-200px)';

        // Fade in the text once letter is up
        setTimeout(() => {
          letterText.style.transition = 'opacity 0.8s ease';
          letterText.style.opacity = '1';
        }, 800);
        setTimeout(() => {
          letterSub.style.transition = 'opacity 0.8s ease';
          letterSub.style.opacity = '1';
        }, 1200);
      }, 1200);

      // Step 3: Fade out envelope, show the card
      setTimeout(() => {
        envelopeIntro.classList.add('hidden');
        setTimeout(() => {
          card.style.display = '';
          setTimeout(typeNext, 1600);
        }, 500);
      }, 4200);
    });

    // ==============================
    // FLOATING HEARTS
    // ==============================
    (function() {
      const container = document.getElementById('hearts-bg');
      const symbols = ['\u2764\uFE0F','\uD83D\uDC95','\uD83D\uDC96','\uD83D\uDC97','\uD83D\uDC9E','\uD83D\uDC93','\uD83E\uDE77','\uD83C\uDF39','\u2728','\uD83C\uDF38','\uD83E\uDDF8','\uD83D\uDC8C'];
      const anims = ['rise','drift'];
      for (let i = 0; i < 60; i++) {
        const s = document.createElement('span');
        s.classList.add('heart', anims[Math.floor(Math.random()*2)]);
        s.textContent = symbols[Math.floor(Math.random()*symbols.length)];
        s.style.left = Math.random()*100+'%';
        s.style.fontSize = (16+Math.random()*28)+'px';
        s.style.animationDuration = (8+Math.random()*14)+'s';
        s.style.animationDelay = (Math.random()*18)+'s';
        container.appendChild(s);
      }
    })();

    // ==============================
    // SPARKLE DOTS
    // ==============================
    (function() {
      const container = document.getElementById('sparkles');
      for (let i = 0; i < 40; i++) {
        const d = document.createElement('div');
        d.classList.add('dot');
        d.style.left = Math.random()*100+'%';
        d.style.top = Math.random()*100+'%';
        const sz = (2+Math.random()*5)+'px';
        d.style.width = sz; d.style.height = sz;
        d.style.animationDuration = (2+Math.random()*4)+'s';
        d.style.animationDelay = (Math.random()*5)+'s';
        d.style.background = `rgba(255,${150+Math.floor(Math.random()*80)},${180+Math.floor(Math.random()*60)},${0.3+Math.random()*0.4})`;
        container.appendChild(d);
      }
    })();

    // ==============================
    // NO BUTTON
    // ==============================
    const btnNo = document.getElementById('btn-no');
    const btnYes = document.getElementById('btn-yes');
    const sadMsg = document.getElementById('sad-message');
    const bear = document.getElementById('cute-bear');
    let noCount = 0;

    const noMessages = [
      { btn: "No",                  msg: "" },
      { btn: "Hehe, wrong button!", msg: "the other one, Nawel!" },
      { btn: "Oops, try again",     msg: "the bear is confused..." },
      { btn: "Naweeeel",            msg: "you sure that's the right button?" },
      { btn: "Hmm really?",         msg: "the bear is giving you puppy eyes" },
      { btn: "But but but...",      msg: "we'd be so cute together tho" },
      { btn: "Pweaseee?",           msg: "the bear still believes in you!" },
      { btn: "Almost there!",       msg: "you know you want to ~" },
    ];
    const yesLabels = ["Yes!","Yes! ~","Yesss!","Click me!","Over here!","Yes Nawel!","This one!","Yes!! ^^"];
    const bearStages = ['\uD83E\uDDF8','\uD83E\uDDF8','\uD83E\uDD7A','\uD83E\uDD7A','\uD83D\uDE4F','\uD83D\uDE4F','\uD83E\uDD7A','\uD83E\uDD7A'];

    btnNo.addEventListener('click', () => {
      noCount++;
      const idx = Math.min(noCount, noMessages.length - 1);
      const yesIdx = Math.min(noCount, yesLabels.length - 1);
      const bearIdx = Math.min(noCount, bearStages.length - 1);

      btnNo.textContent = noMessages[idx].btn;

      sadMsg.textContent = noMessages[idx].msg;
      sadMsg.classList.remove('visible');
      void sadMsg.offsetHeight;
      if (noMessages[idx].msg) sadMsg.classList.add('visible');

      btnYes.style.transform = `scale(${Math.min(1 + noCount * 0.15, 2.5)})`;
      btnYes.textContent = yesLabels[yesIdx];
      btnYes.style.boxShadow = `0 4px ${Math.min(20+noCount*6,50)}px rgba(255,150,180,0.45)`;
      btnYes.style.animation = 'none';

      const noScale = Math.max(1 - noCount * 0.04, 0.6);
      const angle = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random() * 40;
      btnNo.style.transform = `scale(${noScale}) translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist*0.4}px)`;
      btnNo.style.opacity = Math.max(1 - noCount * 0.04, 0.45);

      bear.textContent = bearStages[bearIdx];
      bear.style.animation = 'none';
      void bear.offsetHeight;
      bear.style.animation = 'bearBounce 2s ease-in-out infinite';

      const card = document.getElementById('card');
      card.style.opacity = '1';
      card.style.transform = 'translateY(0) scale(1)';
      card.style.animation = 'none';
      void card.offsetHeight;
      card.style.animation = 'cardWobble 0.6s ease forwards';
    });

    // ==============================
    // YES -> CELEBRATION
    // ==============================
    btnYes.addEventListener('click', () => {
      document.getElementById('card').style.display = 'none';
      document.getElementById('celebration').classList.add('active');
      launchConfetti();
    });

    // ==============================
    // CONFETTI
    // ==============================
    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const pieces = [];
      const colors = ['#ff6b8a','#ffb6c1','#ff8fa3','#ffd1dc','#fff0f3','#ff3e6c','#f5a0c0','#ff85a2'];
      const emojis = ['\u2764\uFE0F','\uD83D\uDC95','\uD83D\uDC96','\uD83C\uDF39','\u2728','\uD83D\uDC97','\uD83D\uDC9E','\uD83E\uDE77'];

      for (let i = 0; i < 250; i++) {
        pieces.push({
          x: Math.random()*canvas.width,
          y: Math.random()*canvas.height - canvas.height,
          r: Math.random()*5+2,
          color: colors[Math.floor(Math.random()*colors.length)],
          vx: (Math.random()-0.5)*5,
          vy: Math.random()*3+1.5,
          rotation: Math.random()*360,
          rotationSpeed: (Math.random()-0.5)*6,
          isEmoji: Math.random()>0.6,
          emoji: emojis[Math.floor(Math.random()*emojis.length)],
          opacity: 1,
          wave: Math.random()*Math.PI*2,
          waveSpeed: 0.02+Math.random()*0.03
        });
      }

      function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        let alive = false;
        for (const p of pieces) {
          p.wave += p.waveSpeed;
          p.x += p.vx + Math.sin(p.wave)*0.5;
          p.y += p.vy;
          p.rotation += p.rotationSpeed;
          p.vy += 0.015;
          if (p.y > canvas.height+30) p.opacity -= 0.008;
          if (p.opacity <= 0) continue;
          alive = true;
          ctx.save();
          ctx.translate(p.x,p.y);
          ctx.rotate(p.rotation*Math.PI/180);
          ctx.globalAlpha = Math.max(p.opacity,0);
          if (p.isEmoji) { ctx.font = `${p.r*3.5}px serif`; ctx.fillText(p.emoji,0,0); }
          else { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill(); }
          ctx.restore();
        }
        if (alive) requestAnimationFrame(draw);
      }
      draw();
      window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    }
  </script>
</body>
